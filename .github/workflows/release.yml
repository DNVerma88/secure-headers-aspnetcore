name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  contents: write

jobs:
  release:
    name: Publish NuGet Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Check for vulnerable packages
        run: |
          dotnet list src/SecureHeaders.AspNetCore/SecureHeaders.AspNetCore.csproj \
            package --vulnerable --include-transitive 2>&1 | tee vuln-output.txt
          if grep -qiE "(High|Critical)" vuln-output.txt; then
            echo "::error::Refusing to publish — High or Critical vulnerabilities detected!"
            exit 1
          fi

      - name: Pack
        run: >
          dotnet pack
          src/SecureHeaders.AspNetCore/SecureHeaders.AspNetCore.csproj
          --configuration Release
          --no-build
          /p:Version=${{ steps.version.outputs.VERSION }}
          --output ./artifacts

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
