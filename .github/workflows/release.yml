name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to release (e.g. 1.0.1)"
        required: true
        default: "1.0.0"

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  contents: write
  id-token: write   # Required for NuGet trusted publishing (OIDC)

# Prevent a second run (triggered by the tag push that workflow_dispatch creates)
# from racing with the first run and uploading a mismatched .snupkg.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    environment: nuget-publish   # Serialises concurrent runs; add approval gate in repo Settings → Environments

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Delete existing tag if it already exists so we can re-tag at HEAD
          git tag -d "${{ steps.version.outputs.TAG }}" 2>/dev/null || true
          git push origin --delete "${{ steps.version.outputs.TAG }}" 2>/dev/null || true
          git tag -a "${{ steps.version.outputs.TAG }}" -m "Release ${{ steps.version.outputs.TAG }}"
          git push origin "${{ steps.version.outputs.TAG }}"

      - name: Clean
        run: dotnet clean --configuration Release

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Check for vulnerable packages
        run: |
          dotnet list src/SecureHeaders.AspNetCore/SecureHeaders.AspNetCore.csproj \
            package --vulnerable --include-transitive 2>&1 | tee vuln-output.txt
          if grep -qiE "(High|Critical)" vuln-output.txt; then
            echo "::error::Refusing to publish — High or Critical vulnerabilities detected!"
            exit 1
          fi

      - name: Pack
        run: >
          dotnet pack
          src/SecureHeaders.AspNetCore/SecureHeaders.AspNetCore.csproj
          --configuration Release
          --no-build
          --no-restore
          /p:Version=${{ steps.version.outputs.VERSION }}
          --output ./publish

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # NuGet.org username (profile name) — not an email address
          user: deepn87

      - name: Publish to NuGet.org
        run: |
          # Capture push output so we can detect whether the package was actually
          # uploaded or skipped as a duplicate.  This matters for the snupkg step:
          # if the nupkg was skipped (already published), the snupkg generated from
          # this build targets ALL current TFMs (net8.0 + net10.0), but the
          # already-published nupkg may only contain a subset of those TFMs.
          # Uploading such a mismatched snupkg causes NuGet.org to reject it with
          # "pdb(s) for dll(s) not found in the nuget package".
          NUPKG_OUTPUT=$(dotnet nuget push "./publish/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate 2>&1)
          echo "$NUPKG_OUTPUT"

          if echo "$NUPKG_OUTPUT" | grep -qiE "already exists|Conflict|409"; then
            echo "::notice::Nupkg already published — skipping symbols upload to prevent TFM mismatch."
          elif ls ./publish/*.snupkg 1>/dev/null 2>&1; then
            # Push symbols only when the nupkg was freshly published in this run,
            # guaranteeing the snupkg and nupkg were produced from the same build.
            dotnet nuget push "./publish/*.snupkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          files: |
            ./publish/*.nupkg
            ./publish/*.snupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
