name: Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run every Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Build for CodeQL
        run: dotnet build --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Check for vulnerable packages (main library)
        run: |
          dotnet list src/SecureHeaders.AspNetCore/SecureHeaders.AspNetCore.csproj \
            package --vulnerable --include-transitive 2>&1 | tee vuln-output.txt
          if grep -qiE "(High|Critical)" vuln-output.txt; then
            echo "::error::High or Critical vulnerabilities detected in package dependencies!"
            cat vuln-output.txt
            exit 1
          fi

      - name: Check for vulnerable packages (tests)
        run: |
          dotnet list tests/SecureHeaders.AspNetCore.Tests/SecureHeaders.AspNetCore.Tests.csproj \
            package --vulnerable --include-transitive 2>&1 | tee vuln-tests.txt
          if grep -qiE "(High|Critical)" vuln-tests.txt; then
            echo "::warning::High or Critical vulnerabilities detected in test dependencies."
            cat vuln-tests.txt
          fi

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-report
          path: |
            vuln-output.txt
            vuln-tests.txt
          retention-days: 30
