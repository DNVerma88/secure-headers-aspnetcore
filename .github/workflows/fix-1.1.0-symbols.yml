name: Fix 1.1.0 Symbols (one-time)

# One-time workflow to republish corrected symbols for SecureHeaders.AspNetCore 1.1.0.
#
# Background: the original 1.1.0 .snupkg was rejected by NuGet.org because:
#   - it contained lib/net10.0/SecureHeaders.AspNetCore.pdb with no matching DLL, and
#   - the embedded nuspec listed net10.0 in <frameworkReferences>, which NuGet.org
#     validates against the DLLs in the published nupkg (net8.0 only).
#
# This workflow downloads the original snupkg from the GitHub Release, patches it
# using .github/scripts/fix_snupkg.py, and re-uploads via the NUGET_API_KEY secret.
#
# Run ONCE via Actions → Fix 1.1.0 Symbols (one-time) → Run workflow.
# Delete this file (and .github/scripts/fix_snupkg.py) once symbols appear on NuGet.org.

on:
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  contents: read

jobs:
  fix-symbols:
    name: Republish corrected 1.1.0 symbols
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (needed for fix_snupkg.py)
        uses: actions/checkout@v4

      - name: Download 1.1.0 snupkg from GitHub Release
        run: |
          gh release download v1.1.0 \
            --repo "${{ github.repository }}" \
            --pattern "*.snupkg" \
            --dir ./snupkg-work
          ls -la ./snupkg-work/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Patch snupkg (remove net10.0 PDB + nuspec groups)
        run: |
          SNUPKG=$(ls ./snupkg-work/*.snupkg)
          echo "Working on: $SNUPKG"
          python3 .github/scripts/fix_snupkg.py "$SNUPKG"

      - name: Push corrected snupkg to NuGet.org
        run: |
          SNUPKG=$(ls ./snupkg-work/*.snupkg)
          echo "Pushing: $SNUPKG"
          dotnet nuget push "$SNUPKG" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json"

